name: Build portfolio

on:
  pull_request:
    branches: [main]

jobs:
  build-portfolio:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0
        with:
          cache: true

      - name: make portfolio
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pixi run make-portfolio
